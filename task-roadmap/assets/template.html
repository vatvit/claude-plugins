<!DOCTYPE html>
<!--
  Task Roadmap (abstract Gantt).
  GENERATED FILE: produced by the task-roadmap plugin (scripts/generate.sh). Do not
  edit by hand; edit the plugin template and regenerate. Self-contained (no network,
  no build) — open directly in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --ink:#e6edf3; --muted:#8b949e;
    --crit:#ff7575;   /* critical-path accent — coral red, distinct from the fills (crit is an outline) */
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{padding:18px 22px;border-bottom:1px solid var(--border)}
  h1{font-size:18px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--border);
          font-size:12px;color:var(--muted);align-items:center}
  .legend .item{display:flex;gap:6px;align-items:center}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
  .crit-key{width:16px;height:12px;border-radius:3px;border:2px solid var(--crit);box-sizing:border-box}
  .panel{margin:22px;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:auto}
  .panel h2{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--border);
            color:var(--muted);font-weight:600;position:sticky;left:0}
  .scroll{overflow:auto;padding:10px}
  svg{display:block}
  .gridline{stroke:var(--border);stroke-width:1}
  .tick{fill:var(--muted);font-size:10px}
  .grp{fill:var(--muted);font-size:11px;font-weight:700}
  .bar text{fill:#0d1117;font-size:10px;font-weight:600}
  .bar rect{rx:4}
  .bar.crit rect{stroke:var(--crit);stroke-width:3}
  .rowlabel{fill:var(--ink);font-size:11px}
  .rowlabel .rid{font-weight:700}
  .rowlabel.rejected{fill:var(--muted);text-decoration:line-through}
  .bar.rejected rect{fill-opacity:.55}
  .strike{stroke:#c9d1d9;stroke-width:1.5}
  .empty{padding:40px;color:var(--muted);text-align:center}
  footer{color:var(--muted);font-size:11px;padding:8px 22px 24px}
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="sub" id="meta"></div>
</header>

<div class="legend" id="legend"></div>

<section class="panel">
  <h2>Abstract timeline (Gantt)
    <span class="sub">— scheduled by dependencies &amp; estimate; horizontal offset = deps. Relative units, not calendar dates.</span></h2>
  <div class="scroll"><svg id="gantt"></svg></div>
</section>

<footer id="foot"></footer>

<script>
"use strict";
// ---- data (injected by generator) ------------------------------------------
const DATA  = __DATA__;
const TASKS = DATA.tasks || [];
const EPICS = DATA.epics || {};   // epic-name -> epic title (group label)

const SVGNS = "http://www.w3.org/2000/svg";
const STATUS_ORDER = ["proposed","blocked","in-progress","completed","rejected"];
const STATUS_COLOR = {
  "proposed":"#ffe6e6",     // bright yellow
  "blocked":"#f85149",      // red
  "in-progress":"#e3b341",  // yellow
  "completed":"#3fb950",    // green
  "rejected":"#484f58"      // dark gray (also drawn crossed-out)
};
const color = s => STATUS_COLOR[s] || "#8b949e";
const groupOf = t => EPICS[t.epic] || t.epic || "—";   // resolve epic-name to its title

function el(tag, attrs){ const n=document.createElementNS(SVGNS,tag);
  for(const k in (attrs||{})) n.setAttribute(k, attrs[k]); return n; }

// ---- model + CPM schedule ---------------------------------------------------
const byId = new Map(TASKS.map(t=>[t.id,t]));
for(const t of TASKS){ t.deps = (t.deps||[]).filter(d=>byId.has(d)); t.est = Math.max(0, +t.estimate||0); }

function schedule(){
  const indeg=new Map(TASKS.map(t=>[t.id,0]));
  const succ=new Map(TASKS.map(t=>[t.id,[]]));
  for(const t of TASKS) for(const d of t.deps){ indeg.set(t.id,indeg.get(t.id)+1); succ.get(d).push(t.id); }
  const q=[...indeg].filter(([,v])=>v===0).map(([k])=>k); const order=[];
  while(q.length){ const id=q.shift(); order.push(id);
    for(const s of succ.get(id)){ indeg.set(s,indeg.get(s)-1); if(indeg.get(s)===0) q.push(s); } }
  for(const t of TASKS) if(!order.includes(t.id)) order.push(t.id); // cycle fallback

  const ES=new Map(), EF=new Map();
  for(const id of order){ const t=byId.get(id);
    const es=t.deps.length? Math.max(...t.deps.map(d=>EF.get(d)??0)) : 0;
    ES.set(id,es); EF.set(id,es+t.est); }
  const PROJECT=Math.max(0,...[...EF.values()]);

  const LF=new Map(), LS=new Map();
  for(let i=order.length-1;i>=0;i--){ const id=order[i]; const t=byId.get(id);
    const ss=succ.get(id);
    const lf=ss.length? Math.min(...ss.map(s=>LS.get(s))) : PROJECT;
    LF.set(id,lf); LS.set(id,lf-t.est); }

  const crit=new Set();
  for(const t of TASKS){ if(Math.abs(LS.get(t.id)-ES.get(t.id))<1e-9 && t.est>0) crit.add(t.id); }
  return {ES,EF,PROJECT,crit};
}
const S = schedule();

// ---- legend + meta ----------------------------------------------------------
(function(){
  const present=new Set(TASKS.map(t=>t.status)), L=document.getElementById("legend");
  for(const s of STATUS_ORDER){ if(!present.has(s)) continue;
    const d=document.createElement("div"); d.className="item";
    d.innerHTML=`<span class="swatch" style="background:${color(s)}"></span>${s}`; L.appendChild(d); }
  const c=document.createElement("div"); c.className="item";
  c.innerHTML=`<span class="crit-key"></span>critical path`; L.appendChild(c);
  document.getElementById("meta").textContent =
    `${TASKS.length} tasks · ${new Set(TASKS.map(groupOf)).size} groups · project length ${S.PROJECT} units`;
})();

// ---- abstract Gantt ---------------------------------------------------------
function drawGantt(){
  const LW=232, UW=26, RH=26, PADY=34, HDR=20, unit=Math.max(1,S.PROJECT);
  const groups=[...new Set(TASKS.map(groupOf))];
  const gMin=g=>Math.min(...TASKS.filter(t=>groupOf(t)===g).map(t=>S.ES.get(t.id)));
  groups.sort((a,b)=>gMin(a)-gMin(b));

  const rows=[];
  for(const g of groups){ rows.push({type:"grp",label:g});
    TASKS.filter(t=>groupOf(t)===g).sort((a,b)=>S.ES.get(a.id)-S.ES.get(b.id)||a.id.localeCompare(b.id))
      .forEach(t=>rows.push({type:"task",t})); }

  const W=LW+unit*UW+40, H=PADY+HDR+rows.length*RH+16;
  const svg=document.getElementById("gantt"); svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.textContent="";

  for(let u=0;u<=unit;u++){ const x=LW+u*UW;
    svg.appendChild(el("line",{class:"gridline",x1:x,y1:PADY,x2:x,y2:H-16,"stroke-opacity":u%5===0?.6:.25}));
    if(u%5===0||unit<=12){ const tx=el("text",{class:"tick",x:x+2,y:PADY-6}); tx.textContent="t"+u; svg.appendChild(tx); } }

  let y=PADY+HDR;
  for(const r of rows){
    if(r.type==="grp"){ const g=el("text",{class:"grp",x:8,y:y+16}); g.textContent=r.label; svg.appendChild(g); y+=RH; continue; }
    const t=r.t, es=S.ES.get(t.id), ef=S.EF.get(t.id), isC=S.crit.has(t.id);
    const rejected=t.status==="rejected";
    const lbl=el("text",{class:"rowlabel"+(rejected?" rejected":""),x:16,y:y+17});
    const rid=el("tspan",{class:"rid"}); rid.textContent=t.id+"  ";
    lbl.appendChild(rid); lbl.appendChild(document.createTextNode(
      (t.title||"").length>20?t.title.slice(0,19)+"…":t.title)); svg.appendChild(lbl);
    const bar=el("g",{class:"bar"+(isC?" crit":"")+(rejected?" rejected":"")});
    const bx=LW+es*UW, bw=Math.max(UW*0.5,(ef-es)*UW);
    bar.appendChild(el("rect",{x:bx,y:y+4,width:bw,height:RH-10,rx:4,fill:color(t.status)}));
    if(bw>=22){ const bt=el("text",{x:bx+6,y:y+17}); bt.textContent=t.est+"u"; bar.appendChild(bt); }
    if(rejected) bar.appendChild(el("line",{class:"strike",x1:bx+2,y1:y+RH/2,x2:bx+bw-2,y2:y+RH/2}));
    bar.appendChild(el("title")).textContent=
      `${t.id} — ${t.title}\n${t.status} · ${groupOf(t)} · start t${es} → end t${ef} (est ${t.est})`;
    svg.appendChild(bar); y+=RH;
  }
}

// ---- render -----------------------------------------------------------------
if(!TASKS.length){
  document.querySelector(".scroll").innerHTML='<div class="empty">No tasks found.</div>';
}else{
  drawGantt();
  document.getElementById("foot").textContent =
    "Generated by the task-roadmap plugin · abstract timeline (relative units, no calendar dates); critical path outlined in coral red.";
}
</script>
</body>
</html>
